# Pipeline de GameStats
#   1. go            formato, vet, pruebas con detector de carreras y binarios
#   2. scala         pruebas y jar ejecutable
#   3. integration   imágenes Docker, instalación desde cero y prueba de humo Go + Scala
#   4. publish       (solo main y tags v*) publica las imágenes en GitHub Container Registry
#   5. deploy        (solo main y tags v*) verifica la versión publicada en un runner temporal
#   6. release       (solo tags v*) crea el Release con el paquete de instalación
name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — pruebas y compilación
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Formato (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Pruebas con detector de carreras
        run: go test -race -count=1 ./...
      - name: Compilar binarios
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/gamestats ./cmd/server
          CGO_ENABLED=0 go build -trimpath -o bin/simulator ./cmd/simulator
      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: go_service/bin/

  scala:
    name: Scala — pruebas y jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scala_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Pruebas y ensamblado
        run: sbt -batch test assembly
      - uses: actions/upload-artifact@v4
        with:
          name: scala-jar
          path: scala_service/target/scala-3.3.1/gamestats-analytics.jar

  integration:
    name: Integración en contenedores
    needs: [go, scala]
    runs-on: ubuntu-latest
    env:
      SKIP_TESTS: "true" # las pruebas ya corrieron en los dos trabajos anteriores
    steps:
      - uses: actions/checkout@v4
      - name: Instalación desde cero con el script del proyecto
        run: bash scripts/install.sh
      - name: Estado de la bandeja y resumen por juego
        run: |
          curl -fsS http://localhost:8081/inbox
          curl -fsS http://localhost:8080/stats/games
      - name: Registros de los contenedores
        if: always()
        run: docker compose logs --no-color > compose-logs.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            data/results/
            compose-logs.txt
      - name: Detener
        if: always()
        run: docker compose down

  publish:
    name: Publicar imágenes
    needs: integration
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        env:
          SKIP_TESTS: "true"
        run: |
          export IMAGE_REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="latest sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags="$tags ${GITHUB_REF_NAME}"; fi
          GAMESTATS_TAG=build docker compose build scala-analytics go-service
          for service in scala-analytics go-service; do
            for tag in $tags; do
              docker tag "$IMAGE_REGISTRY/$service:build" "$IMAGE_REGISTRY/$service:$tag"
              docker push "$IMAGE_REGISTRY/$service:$tag"
            done
          done

  deploy:
    name: Verificar versión publicada (entorno temporal)
    needs: publish
    # Con un runner propio (runs-on: self-hosted) este trabajo instala la versión en esa máquina.
    runs-on: ubuntu-latest
    environment: release-verification
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Instalar la versión publicada y verificarla
        run: |
          export IMAGE_REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          export GAMESTATS_TAG="sha-${GITHUB_SHA::7}"
          bash scripts/install.sh --release
      - name: Registros
        if: always()
        run: COMPOSE_FILE=docker-compose.release.yml docker compose logs --no-color | tail -200 || true

  release:
    name: Release con paquete de instalación
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Armar paquete
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          mkdir -p dist/gamestats/scripts
          sed "s#ghcr.io/brxck2203/lenguajesproject1#${registry}#; s#GAMESTATS_TAG:-latest#GAMESTATS_TAG:-${GITHUB_REF_NAME}#" docker-compose.release.yml > dist/gamestats/docker-compose.release.yml
          cp scripts/install.sh scripts/install.ps1 scripts/smoke-test.sh dist/gamestats/scripts/
          cp docs/release-readme.md dist/gamestats/README.md
          cp -r docs dist/gamestats/docs
          cd dist && zip -r "gamestats-${GITHUB_REF_NAME}.zip" gamestats
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/gamestats-${{ github.ref_name }}.zip
          generate_release_notes: true
